<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="url(#glow)" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="200" r="40" fill="url(#glow)" opacity="0.8"/>
  <circle cx="200" cy="200" r="20" fill="#fff"/>
  <!-- Neural connections -->
  <g stroke="url(#glow)" stroke-width="1" opacity="0.6">
    <line x1="200" y1="200" x2="280" y2="140"/>
    <line x1="200" y1="200" x2="300" y2="220"/>
    <line x1="200" y1="200" x2="260" y2="300"/>
    <line x1="200" y1="200" x2="140" y2="280"/>
    <line x1="200" y1="200" x2="100" y2="180"/>
    <line x1="200" y1="200" x2="130" y2="120"/>
  </g>
  <!-- Outer nodes -->
  <circle cx="280" cy="140" r="8" fill="url(#glow)"/>
  <circle cx="300" cy="220" r="6" fill="url(#glow)"/>
  <circle cx="260" cy="300" r="7" fill="url(#glow)"/>
  <circle cx="140" cy="280" r="5" fill="url(#glow)"/>
  <circle cx="100" cy="180" r="8" fill="url(#glow)"/>
  <circle cx="130" cy="120" r="6" fill="url(#glow)"/>
  <text x="200" y="380" text-anchor="middle" fill="#fff" font-family="monospace" font-size="24" font-weight="bold">PHOEBE</text>
</svg>